<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Переадресация по событию</title>
</head>
<body>

<button id="redirectButton">Перейти на другой хост</button>

<script>
// Функция, которая будет вызвана при событии click на кнопке
function redirectToOtherHost() {
    // Замените 'https://example.com' на URL вашего целевого хоста
    window.location.href = '/';
}

// Получаем кнопку по ее идентификатору
var redirectButton = document.getElementById('redirectButton');

// Добавляем обработчик события click на кнопке
redirectButton.addEventListener('click', redirectToOtherHost);
</script>

</body>
</html>
