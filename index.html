<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jexcel/1.5.7/js/jquery.jexcel.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jexcel/1.5.7/css/jquery.jexcel.css" type="text/css" />
    
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./components/tree/tree-styles.css">
    <title>Document</title>
    <script src="./api-client.js" defer></script>
    <script src="./components/tree/tree-data.js" defer></script>
    <script src="./index.js" defer></script>
</head>

<body>
<!-- Кнопка загрузки данных -->
<div class="load-section">
    <button id="load-tree-btn" class="load-btn">
        <span id="btn-text">Загрузить дерево с сервера в svg</span>
        <span id="timer-display" class="timer-display" style="display: none;">0.00с</span>
    </button>
    <div id="loading-indicator" class="loading-indicator" style="display: none;">
        Загрузка данных...
    </div>
</div>

<!-- Древовидный компонент -->
<div class="tree-container" id="tree-container" style="display: none;">
    <div class="tree-header" id="tree-header">
        Древовидная структура (нажмите кнопку для загрузки)
    </div>
    <div class="tree-stats" id="tree-stats">
        Загрузка...
    </div>
</div>

<script>
// Функция для обновления статистики
function updateTreeStats() {
    const statsElement = document.getElementById('tree-stats');
    const headerElement = document.getElementById('tree-header');
    
    if (!statsElement || !headerElement) return;
    
    // Получаем данные из TreeData
    const treeData = window.TreeData.treeData();
    const dataMap = window.TreeData.dataMap();
    
    let systemPackCount = 0;
    let bmrzCount = 0;
    
    // Подсчитываем элементы по типам
    dataMap.forEach(item => {
        if (item.type === 'system_pack') {
            systemPackCount++;
        } else if (item.type === 'bmrz') {
            bmrzCount++;
        }
    });
    
    const totalCount = systemPackCount + bmrzCount;
    
    // Обновляем заголовок
    headerElement.textContent = `Древовидная структура (${totalCount} элементов)`;
    
    // Обновляем статистику
    statsElement.innerHTML = `
        System Pack: ${systemPackCount} элементов | 
        BMRZ: ${bmrzCount} элементов | 
        Всего: ${totalCount} элементов
    `;
}

// Переменные для таймера
let timerInterval = null;
let startTime = 0;
let isTimerRunning = false;

// Функция для запуска таймера
function startTimer() {
    if (isTimerRunning) return;
    
    startTime = Date.now();
    isTimerRunning = true;
    
    const timerDisplay = document.getElementById('timer-display');
    const btnText = document.getElementById('btn-text');
    
    // Показываем таймер и скрываем текст кнопки
    timerDisplay.style.display = 'inline-block';
    btnText.style.display = 'none';
    
    // Обновляем таймер каждые 10мс для точности
    timerInterval = setInterval(() => {
        const elapsed = (Date.now() - startTime) / 1000;
        timerDisplay.textContent = elapsed.toFixed(2) + 'с';
    }, 10);
}

// Функция для остановки таймера
function stopTimer() {
    if (!isTimerRunning) return;
    
    isTimerRunning = false;
    clearInterval(timerInterval);
    timerInterval = null;
    
    const timerDisplay = document.getElementById('timer-display');
    const btnText = document.getElementById('btn-text');
    
    // Фиксируем финальное время
    const finalTime = (Date.now() - startTime) / 1000;
    timerDisplay.textContent = finalTime.toFixed(2) + 'с';
    
    // Показываем текст кнопки и таймер
    btnText.style.display = 'inline-block';
    timerDisplay.style.display = 'inline-block';
}

// Функция для сброса таймера
function resetTimer() {
    if (isTimerRunning) {
        clearInterval(timerInterval);
        timerInterval = null;
        isTimerRunning = false;
    }
    
    const timerDisplay = document.getElementById('timer-display');
    const btnText = document.getElementById('btn-text');
    
    // Скрываем таймер и показываем текст кнопки
    timerDisplay.style.display = 'none';
    btnText.style.display = 'inline-block';
    timerDisplay.textContent = '0.00с';
}

// Инициализация при загрузке страницы
document.addEventListener('DOMContentLoaded', function() {
    const loadBtn = document.getElementById('load-tree-btn');
    const loadingIndicator = document.getElementById('loading-indicator');
    
    // Обработчик клика по кнопке загрузки
    loadBtn.addEventListener('click', async function() {
        try {
            // Сбрасываем таймер при новом нажатии
            resetTimer();
            
            // Запускаем таймер
            startTimer();
            
            // Показываем индикатор загрузки
            loadBtn.disabled = true;
            loadingIndicator.style.display = 'block';
            
            // Инициализируем данные с сервера
            const success = await window.TreeData.initializeTreeData();
            
            if (success) {
                // Обновляем статистику
                updateTreeStats();
                
                // Рендерим дерево
                window.TreeData.renderTree();
                
                // Останавливаем таймер после отображения контента
                stopTimer();
                
                // Скрываем индикатор загрузки, но оставляем кнопку видимой
                loadingIndicator.style.display = 'none';
            } else {
                throw new Error('Не удалось загрузить данные с сервера');
            }
        } catch (error) {
            console.error('Ошибка при загрузке данных:', error);
            alert('Ошибка при загрузке данных: ' + error.message);
            
            // Останавливаем таймер при ошибке
            stopTimer();
            
            // Восстанавливаем кнопку
            loadBtn.disabled = false;
            loadingIndicator.style.display = 'none';
        } finally {
            // Восстанавливаем кнопку
            loadBtn.disabled = false;
        }
    });
});
</script>
</body>
</html>
