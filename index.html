<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jexcel/1.5.7/js/jquery.jexcel.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jexcel/1.5.7/css/jquery.jexcel.css" type="text/css" />
    
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./components/tree/tree-styles.css">
    <title>Document</title>
    <script src="./components/tree/tree-data.js" defer></script>
    <script src="./index.js" defer></script>
</head>

<body>
<!-- Древовидный компонент -->
<div class="tree-container" id="tree-container">
    <div class="tree-header">
        Древовидная структура (200 элементов)
    </div>
    <div class="tree-stats" id="tree-stats">
        Загрузка...
    </div>
</div>

<script>
// Функция для обновления статистики
function updateTreeStats() {
    const statsElement = document.getElementById('tree-stats');
    if (!statsElement) return;
    
    const systemPackCount = 100;
    const bmrzCount = 100;
    const totalCount = systemPackCount + bmrzCount;
    
    statsElement.innerHTML = `
        System Pack: ${systemPackCount} элементов | 
        BMRZ: ${bmrzCount} элементов | 
        Всего: ${totalCount} элементов
    `;
}

// Инициализация дерева при загрузке страницы
document.addEventListener('DOMContentLoaded', function() {
    // Обновляем статистику
    updateTreeStats();
    
    // Рендерим дерево
    if (window.TreeData && window.TreeData.renderTree) {
        window.TreeData.renderTree();
    } else {
        console.error('TreeData не загружен');
    }
});
</script>
</body>
</html>
