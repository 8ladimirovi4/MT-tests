<!-- поиск и замена -->
<!-- Ctrl-F / Cmd-F
Start searching
Ctrl-G / Cmd-G
Find next
Shift-Ctrl-G / Shift-Cmd-G
Find previous
Shift-Ctrl-F / Cmd-Option-F
Replace
Shift-Ctrl-R / Shift-Cmd-Option-F
Replace all
Alt-F
Persistent search (dialog doesn't autoclose, enter to find next, Shift-Enter to find previous)
Alt-G
Jump to line -->
<script src="codemirror/addon/dialog/advanced-dialog.js"></script>
<script src="codemirror/addon/dialog/dialog.js"></script>

  <!-- Tern  -->
  <!-- Ctrl-Space
Autocomplete
Ctrl-O
Find docs for the expression at the cursor
Ctrl-I
Find type at cursor
Alt-.
Jump to definition (Alt-, to jump back)
Ctrl-Q
Rename variable
Ctrl-.
Select all occurrences of a variable -->
<script src="codemirror/addon/tern/tern.js"></script>
